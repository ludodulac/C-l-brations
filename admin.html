<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Célébrations des Archanges</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><div class="top-inner"><div><div class="eyebrow">Administration</div><div class="brand">Célébrations des Archanges</div></div><a class="btn" href="index.html">Voir le site public</a></div></header>
<main class="container"><div class="section-head"><div><h1 style="margin:0">Centre de gestion</h1><p class="muted">Choisissez une célébration, puis modifiez librement ses jours, ses dates et son programme.</p></div></div><div class="admin-shell"><nav class="admin-nav"><button class="btn active" data-admin="celebrations">Célébrations</button><button class="btn" data-admin="program">Programme</button><button class="btn" data-admin="media">Médias & contenus</button><button class="btn" data-admin="categories">Catégories</button><button class="btn" data-admin="groups">Groupes</button></nav><section id="panel"></section></div></main>
<div class="toast" id="toast"></div><script src="app-data.js"></script>
<script>
const state=loadState();let tab='celebrations';
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const selected=()=>state.celebrations.find(c=>c.id===state.adminCelebrationId)||state.celebrations[0];
function accent(){document.documentElement.style.setProperty('--accent',ARCHANGELS[selected()?.archangel]||'#b42318')}
function setTab(t){tab=t;document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin===t));render()}
document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>setTab(b.dataset.admin));
const groupOptions=(v='all')=>state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===v?'selected':''}>${esc(g.name)}</option>`).join('');
const categoryOptions=(v='')=>state.categories.map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('');
function context(){const c=selected(),r=celebrationRange(c);return `<div class="admin-context"><div><span class="badge">Vous travaillez sur</span><strong style="display:block;margin-top:5px">Archange ${esc(c.archangel)} ${esc(c.year)}</strong><span class="muted">${r.start?`${formatDate(r.start)} → ${formatDate(r.end)}`:'Aucune date définie'}</span></div><button class="btn small" onclick="setTab('celebrations')">Changer de célébration</button></div>`}
function render(){accent();if(tab==='celebrations')renderCelebrations();if(tab==='program')renderProgram();if(tab==='media')renderMedia();if(tab==='categories')renderCategories();if(tab==='groups')renderGroups()}
function renderCelebrations(){panel.innerHTML=`<div class="card"><div class="eyebrow">Célébrations</div><h2>Choisir la célébration à gérer</h2><p class="muted">La couleur et tout le programme suivent toujours la célébration sélectionnée.</p><div class="list">${state.celebrations.map(c=>{const r=celebrationRange(c),col=ARCHANGELS[c.archangel]||'#999';return `<div class="admin-row ${c.id===state.adminCelebrationId?'selected':''}" style="border-left:5px solid ${col}"><div><strong>Archange ${esc(c.archangel)} ${esc(c.year)}</strong><div class="meta">${r.start?`${formatDate(r.start)} → ${formatDate(r.end)}`:'Dates à définir'}${c.id===state.currentCelebrationId?' · affichée au public':''}</div></div><div class="row-actions"><button class="btn" style="border-color:${col};color:${col}" onclick="manage(${c.id})">Gérer</button><button class="btn" onclick="editCelebration(${c.id})">Modifier</button><button class="btn danger" onclick="removeCelebration(${c.id})">Supprimer</button></div></div>`}).join('')}</div></div><div class="card section"><h3>Ajouter une célébration</h3><div class="form-grid"><label class="field"><span>Archange</span><select id="newArch"><option>Michaël</option><option>Gabriel</option><option>Raphaël</option><option>Ouriel</option></select></label><label class="field"><span>Année</span><input id="newYear" placeholder="2029"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="addCelebration">Ajouter</button></div><p class="help">Les jours et les dates se configurent ensuite dans le Programme.</p></div>`;addCelebration.onclick=()=>{const y=newYear.value.trim();if(!y)return toast('Indiquez une année');const id=Date.now();state.celebrations.push({id,archangel:newArch.value,year:y,status:'planned',days:[{key:'preparation-'+id,label:'Préparation',date:''}]});state.adminCelebrationId=id;saveState(state);setTab('program')}}
function manage(id){state.adminCelebrationId=id;saveState(state);accent();setTab('program')}
function editCelebration(id){state.adminCelebrationId=id;saveState(state);accent();const c=selected();panel.innerHTML=`${context()}<div class="card"><h2>Modifier la célébration</h2><div class="form-grid"><label class="field"><span>Archange</span><select id="eArch"><option ${c.archangel==='Michaël'?'selected':''}>Michaël</option><option ${c.archangel==='Gabriel'?'selected':''}>Gabriel</option><option ${c.archangel==='Raphaël'?'selected':''}>Raphaël</option><option ${c.archangel==='Ouriel'?'selected':''}>Ouriel</option></select></label><label class="field"><span>Année / nom de période</span><input id="eYear" value="${esc(c.year)}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveC">Enregistrer</button>${c.id!==state.currentCelebrationId?'<button class="btn dark" id="publishC">Afficher au public</button>':''}<button class="btn" onclick="renderCelebrations()">Retour</button></div><p class="help">Les dates se règlent jour par jour dans Programme.</p></div>`;saveC.onclick=()=>{c.archangel=eArch.value;c.year=eYear.value.trim()||c.year;saveState(state);accent();renderCelebrations();toast('Célébration mise à jour')};if(document.getElementById('publishC'))publishC.onclick=()=>{state.currentCelebrationId=c.id;saveState(state);toast('Cette célébration est maintenant affichée au public');renderCelebrations()}}
function removeCelebration(id){if(state.celebrations.length===1)return toast('Gardez au moins une célébration');const c=state.celebrations.find(x=>x.id===id);if(!confirm(`Supprimer Archange ${c.archangel} ${c.year} et son programme ?`))return;state.celebrations=state.celebrations.filter(x=>x.id!==id);state.events=state.events.filter(e=>e.celebrationId!==id);if(state.currentCelebrationId===id)state.currentCelebrationId=state.celebrations[0].id;if(state.adminCelebrationId===id)state.adminCelebrationId=state.celebrations[0].id;saveState(state);accent();renderCelebrations()}
function renderProgram(){const c=selected();if(!c)return;const days=c.days||[],events=state.events.filter(e=>e.celebrationId===c.id);panel.innerHTML=`${context()}<div class="card"><div class="eyebrow">Jours et dates</div><h2>Construire les jours de la célébration</h2><p class="muted">Tout est amovible : ajoutez, modifiez ou supprimez les jours. Michaël est prérempli du 16 au 20 septembre 2026, mais ces dates restent modifiables.</p><div class="list">${days.length?days.map(d=>`<div class="admin-row"><div><strong>${esc(d.label)}</strong><div class="meta">${d.date?formatDate(d.date):'Sans date'}</div></div><div class="row-actions"><button class="btn" onclick="editDay('${d.key}')">Modifier</button><button class="btn danger" onclick="removeDay('${d.key}')">Supprimer</button></div></div>`).join(''):'<div class="notice">Aucun jour. Ajoutez le premier jour ci-dessous.</div>'}</div><div class="form-grid" style="margin-top:18px"><label class="field"><span>Nom du jour</span><input id="newDayLabel" placeholder="Ex. Mercredi, Préparation, Arrivée..."></label><label class="field"><span>Date facultative</span><input id="newDayDate" type="date"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="addDay">Ajouter ce jour</button></div></div><div class="card section"><div class="eyebrow">Programme</div><h2>Ajouter un rendez-vous</h2>${days.length?`<div class="form-grid"><label class="field"><span>Jour</span><select id="pDay">${days.map(d=>`<option value="${esc(d.key)}">${esc(d.label)}${d.date?' — '+formatDate(d.date,{day:'numeric',month:'long'}):''}</option>`).join('')}</select></label><label class="field"><span>Horaire</span><input id="pTime" type="time"></label><label class="field full"><span>Titre</span><input id="pTitle" placeholder="Ex. Office du matin"></label><label class="field"><span>Visible pour</span><select id="pGroup">${groupOptions()}</select></label><label class="field full"><span>Description facultative</span><textarea id="pDesc"></textarea></label></div><h3>Contenus associés</h3><div class="check-grid">${state.contents.length?state.contents.map(x=>`<label class="check"><input type="checkbox" name="content" value="${x.id}"><span><strong>${contentIcon(x.type)} ${esc(x.name)}</strong><br><span class="muted">${esc(x.type)}</span></span></label>`).join(''):'<div class="notice">Aucun contenu : créez-en dans Médias & contenus.</div>'}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="addEvent">Ajouter au programme</button></div>`:'<div class="notice">Ajoutez d’abord au moins un jour.</div>'}</div><div class="card section"><h2>Rendez-vous existants</h2><div class="list">${events.length?events.map(e=>{const d=dayForEvent(c,e);return `<div class="admin-row"><div><strong>${esc(e.title)}</strong><div class="meta">${esc(d?.label||'Jour supprimé')}${d?.date?' · '+formatDate(d.date):''} · ${esc(e.time||'—')}</div></div><button class="btn danger" onclick="removeEvent(${e.id})">Supprimer</button></div>`}).join(''):'<div class="notice">Aucun rendez-vous pour cette célébration.</div>'}</div></div>`;addDay.onclick=()=>{const label=newDayLabel.value.trim();if(!label)return toast('Indiquez le nom du jour');c.days.push({key:dateKey(),label,date:newDayDate.value});saveState(state);renderProgram();toast('Jour ajouté')};if(document.getElementById('addEvent'))addEvent.onclick=()=>{const title=pTitle.value.trim();if(!title)return toast('Indiquez un titre');state.events.push({id:Date.now(),celebrationId:c.id,dayKey:pDay.value,time:pTime.value,title,audience:pGroup.value,description:pDesc.value,contentIds:[...document.querySelectorAll('input[name=content]:checked')].map(x=>+x.value)});saveState(state);renderProgram();toast('Rendez-vous ajouté')}}
function editDay(key){const c=selected(),d=c.days.find(x=>x.key===key);panel.innerHTML=`${context()}<div class="card"><h2>Modifier un jour</h2><div class="form-grid"><label class="field"><span>Nom du jour</span><input id="dLabel" value="${esc(d.label)}"></label><label class="field"><span>Date</span><input id="dDate" type="date" value="${esc(d.date)}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveDay">Enregistrer</button><button class="btn" onclick="renderProgram()">Annuler</button></div></div>`;saveDay.onclick=()=>{d.label=dLabel.value.trim()||d.label;d.date=dDate.value;saveState(state);renderProgram();toast('Jour modifié')}}
function removeDay(key){const c=selected(),d=c.days.find(x=>x.key===key),n=state.events.filter(e=>e.celebrationId===c.id&&e.dayKey===key).length;if(!confirm(`Supprimer « ${d.label} »${n?` et ses ${n} rendez-vous`:''} ?`))return;c.days=c.days.filter(x=>x.key!==key);state.events=state.events.filter(e=>!(e.celebrationId===c.id&&e.dayKey===key));saveState(state);renderProgram()}
function removeEvent(id){if(!confirm('Supprimer ce rendez-vous ?'))return;state.events=state.events.filter(e=>e.id!==id);saveState(state);renderProgram()}
function renderMedia(){panel.innerHTML=`<div class="card"><div class="eyebrow">Médias & contenus</div><h2>Ajouter un contenu</h2><div class="type-grid" id="types">${['PDF','Audio','Texte','Vidéo','Lien'].map((t,i)=>`<button class="type-card ${i===0?'active':''}" data-type="${t}">${contentIcon(t)}<br><strong>${t}</strong></button>`).join('')}</div><div id="mediaForm" style="margin-top:18px"></div></div><div class="card section"><h2>Contenus existants</h2><div class="list">${state.contents.length?state.contents.map(c=>`<div class="admin-row"><div><strong>${contentIcon(c.type)} ${esc(c.name)}</strong><div class="meta">${esc(c.type)} · ${esc(c.category||'Sans catégorie')}</div></div><button class="btn danger" onclick="removeContent(${c.id})">Supprimer</button></div>`).join(''):'<div class="notice">Aucun contenu.</div>'}</div></div>`;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));renderMediaForm(b.dataset.type)});renderMediaForm('PDF')}
function renderMediaForm(type){let source='';if(type==='PDF')source='<label class="field"><span>Fichier PDF</span><input id="mFile" type="file" accept="application/pdf,.pdf"></label>';if(type==='Audio')source='<label class="field"><span>Source</span><select id="mSource"><option value="file">Fichier MP3 / audio</option><option value="url">Lien audio</option></select></label><div id="sourceBox"></div>';if(type==='Texte')source='<label class="field"><span>Source</span><select id="mSource"><option value="text">Écrire le texte</option><option value="file">Charger un fichier</option><option value="url">Lien</option></select></label><div id="sourceBox"></div>';if(type==='Vidéo')source='<label class="field"><span>Lien vidéo</span><input id="mUrl" type="url" placeholder="https://..."></label>';if(type==='Lien')source='<label class="field"><span>Lien</span><input id="mUrl" type="url" placeholder="https://..."></label>';mediaForm.innerHTML=`<div class="form-grid"><label class="field full"><span>Titre</span><input id="mTitle"></label><label class="field"><span>Catégorie</span><select id="mCategory">${categoryOptions()}</select></label><label class="field"><span>Visible pour</span><select id="mGroup">${groupOptions()}</select></label><label class="field full"><span>Description</span><textarea id="mDesc"></textarea></label></div><div style="margin-top:14px">${source}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveMedia">Ajouter</button></div>`;if(type==='Audio'||type==='Texte'){const draw=()=>{sourceBox.innerHTML=mSource.value==='file'?`<label class="field"><span>Fichier</span><input id="mFile" type="file" ${type==='Audio'?'accept="audio/*,.mp3"':''}></label>`:mSource.value==='url'?'<label class="field"><span>Lien</span><input id="mUrl" type="url"></label>':'<label class="field"><span>Texte</span><textarea id="mText"></textarea></label>'};mSource.onchange=draw;draw()}saveMedia.onclick=async()=>{const name=mTitle.value.trim();if(!name)return toast('Indiquez un titre');const id=Date.now(),sourceType=type==='PDF'?'file':type==='Vidéo'||type==='Lien'?'url':document.getElementById('mSource')?.value||'text';const item={id,name,type,category:mCategory.value,audience:mGroup.value,description:mDesc.value,sourceType,url:document.getElementById('mUrl')?.value||'',text:document.getElementById('mText')?.value||''};if(sourceType==='file'){const f=document.getElementById('mFile')?.files?.[0];if(!f)return toast('Choisissez un fichier');await putMedia(id,f);item.fileName=f.name}if(sourceType==='url'&&!item.url)return toast('Indiquez un lien');state.contents.push(item);saveState(state);renderMedia();toast('Contenu ajouté')}}
async function removeContent(id){if(!confirm('Supprimer ce contenu ?'))return;state.contents=state.contents.filter(c=>c.id!==id);state.events.forEach(e=>e.contentIds=(e.contentIds||[]).filter(x=>x!==id));await deleteMedia(id).catch(()=>{});saveState(state);renderMedia()}
function renderCategories(){panel.innerHTML=`<div class="card"><h2>Catégories</h2><div class="searchbar"><input id="newCat"><button class="btn primary" id="addCat">Ajouter</button></div><div class="list">${state.categories.map(c=>`<div class="admin-row"><strong>${esc(c)}</strong><button class="btn danger" onclick="removeCategory('${c.replace(/'/g,"\\'")}')">Supprimer</button></div>`).join('')}</div></div>`;addCat.onclick=()=>{const v=newCat.value.trim();if(v&&!state.categories.includes(v)){state.categories.push(v);saveState(state);renderCategories()}}}
function removeCategory(n){if(state.contents.some(c=>c.category===n))return toast('Cette catégorie est encore utilisée');if(confirm(`Supprimer « ${n} » ?`)){state.categories=state.categories.filter(c=>c!==n);saveState(state);renderCategories()}}
function renderGroups(){panel.innerHTML=`<div class="card"><h2>Groupes</h2><div class="searchbar"><input id="newGroup"><button class="btn primary" id="addGroup">Ajouter</button></div><div class="list">${state.groups.map(g=>`<div class="admin-row"><strong>${esc(g.name)}</strong>${g.id==='all'?'<span class="muted">Groupe général</span>':`<button class="btn danger" onclick="removeGroup('${g.id}')">Supprimer</button>`}</div>`).join('')}</div></div>`;addGroup.onclick=()=>{const n=newGroup.value.trim();if(n){state.groups.push({id:'group-'+Date.now(),name:n});saveState(state);renderGroups()}}}
function removeGroup(id){if(!confirm('Supprimer ce groupe ? Les éléments concernés seront visibles pour Tous.'))return;state.contents.forEach(c=>{if(c.audience===id)c.audience='all'});state.events.forEach(e=>{if(e.audience===id)e.audience='all'});state.groups=state.groups.filter(g=>g.id!==id);saveState(state);renderGroups()}
render();
</script></body></html>
