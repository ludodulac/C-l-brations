<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Célébrations des Archanges</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><div class="top-inner"><div><div class="eyebrow">Administration</div><div class="brand">Célébrations des Archanges</div></div><a class="btn" href="index.html">Voir le site public</a></div></header>
<main class="container"><div class="section-head"><div><h1 style="margin:0">Centre de gestion</h1><p class="muted">Créez les contenus, puis associez-les au programme de la célébration choisie.</p></div></div><div class="admin-shell"><nav class="admin-nav"><button class="btn active" data-admin="celebrations">Célébrations</button><button class="btn" data-admin="program">Programme</button><button class="btn" data-admin="media">Médias & contenus</button><button class="btn" data-admin="categories">Catégories</button><button class="btn" data-admin="groups">Groupes</button></nav><section id="panel"></section></div></main>
<div class="toast" id="toast"></div><script src="app-data.js"></script>
<script>
const state=loadState();let adminTab='celebrations';
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function selectedCelebration(){return state.celebrations.find(c=>c.id===state.adminCelebrationId)||state.celebrations[0]}
function groupOptions(selected='all'){return state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')}
function categoryOptions(selected=''){return state.categories.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function setTab(t){adminTab=t;document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin===t));render()}
document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>setTab(b.dataset.admin));
function context(){const c=selectedCelebration();return c?`<div class="admin-context"><div><span class="badge">Célébration sélectionnée</span><strong style="display:block;margin-top:5px">Archange ${esc(c.archangel)} ${esc(c.year)}</strong><span class="muted">${c.startDate&&c.endDate?`${formatDate(c.startDate)} → ${formatDate(c.endDate)}`:'Dates à définir'}</span></div><button class="btn small" onclick="setTab('celebrations')">Changer</button></div>`:''}
function render(){document.documentElement.style.setProperty('--accent',ARCHANGELS[selectedCelebration()?.archangel]||'#b42318');if(adminTab==='celebrations')renderCelebrations();if(adminTab==='program')renderProgram();if(adminTab==='media')renderMedia();if(adminTab==='categories')renderCategories();if(adminTab==='groups')renderGroups()}
function renderCelebrations(){panel.innerHTML=`<div class="card"><div class="eyebrow">Célébrations</div><h2>Choisir la célébration à gérer</h2><p class="muted">Chaque célébration possède son propre programme. La bibliothèque de contenus reste commune.</p><div class="list">${state.celebrations.map(c=>`<div class="admin-row ${c.id===state.adminCelebrationId?'selected':''}"><div><strong>Archange ${esc(c.archangel)} ${esc(c.year)}</strong><div class="meta">${c.startDate&&c.endDate?`${formatDate(c.startDate)} → ${formatDate(c.endDate)}`:'Dates à définir'} ${c.id===state.currentCelebrationId?'· affichée au public':''}</div></div><div class="row-actions"><button class="btn primary" onclick="manageCelebration(${c.id})">Gérer</button><button class="btn" onclick="editCelebration(${c.id})">Modifier</button><button class="btn danger" onclick="removeCelebration(${c.id})">Supprimer</button></div></div>`).join('')}</div></div><div class="card section"><h3>Ajouter une célébration</h3><div class="form-grid"><label class="field"><span>Archange</span><select id="newArch"><option>Michaël</option><option>Gabriel</option><option>Raphaël</option><option>Ouriel</option></select></label><label class="field"><span>Année</span><input id="newYear" placeholder="2029"></label><label class="field"><span>Date de début</span><input id="newStart" type="date"></label><label class="field"><span>Date de fin</span><input id="newEnd" type="date"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="addCelebration">Ajouter</button></div></div>`;addCelebration.onclick=()=>{const year=newYear.value.trim();if(!year)return toast('Indiquez une année');const id=Date.now();state.celebrations.push({id,archangel:newArch.value,year,startDate:newStart.value,endDate:newEnd.value,status:'planned'});state.adminCelebrationId=id;saveState(state);render();toast('Célébration ajoutée')}}
function manageCelebration(id){state.adminCelebrationId=id;saveState(state);setTab('program')}
function editCelebration(id){const c=state.celebrations.find(x=>x.id===id);panel.innerHTML=`<div class="card"><h2>Modifier Archange ${esc(c.archangel)} ${esc(c.year)}</h2><div class="form-grid"><label class="field"><span>Archange</span><select id="eArch"><option ${c.archangel==='Michaël'?'selected':''}>Michaël</option><option ${c.archangel==='Gabriel'?'selected':''}>Gabriel</option><option ${c.archangel==='Raphaël'?'selected':''}>Raphaël</option><option ${c.archangel==='Ouriel'?'selected':''}>Ouriel</option></select></label><label class="field"><span>Année</span><input id="eYear" value="${esc(c.year)}"></label><label class="field"><span>Début</span><input id="eStart" type="date" value="${esc(c.startDate||'')}"></label><label class="field"><span>Fin</span><input id="eEnd" type="date" value="${esc(c.endDate||'')}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveCelebration">Enregistrer</button><button class="btn" onclick="renderCelebrations()">Annuler</button>${c.id!==state.currentCelebrationId?`<button class="btn dark" id="publishCelebration">Afficher au public</button>`:''}</div></div>`;saveCelebration.onclick=()=>{c.archangel=eArch.value;c.year=eYear.value.trim()||c.year;c.startDate=eStart.value;c.endDate=eEnd.value;saveState(state);renderCelebrations();toast('Célébration mise à jour')};if(document.getElementById('publishCelebration'))publishCelebration.onclick=()=>{state.currentCelebrationId=c.id;saveState(state);renderCelebrations();toast('Célébration affichée au public')}}
function removeCelebration(id){if(state.celebrations.length===1)return toast('Gardez au moins une célébration');const c=state.celebrations.find(x=>x.id===id);if(!confirm(`Supprimer Archange ${c.archangel} ${c.year} et tous ses rendez-vous ?`))return;state.celebrations=state.celebrations.filter(x=>x.id!==id);state.events=state.events.filter(e=>e.celebrationId!==id);if(state.currentCelebrationId===id)state.currentCelebrationId=state.celebrations[0].id;if(state.adminCelebrationId===id)state.adminCelebrationId=state.celebrations[0].id;saveState(state);renderCelebrations()}
function renderProgram(){const c=selectedCelebration();if(!c){panel.innerHTML='<div class="notice">Créez d’abord une célébration.</div>';return}const days=[{key:'preparation',label:'Préparation',date:''},...daysBetween(c.startDate,c.endDate).map(d=>({key:d.key,label:d.label.charAt(0).toUpperCase()+d.label.slice(1),date:d.date}))];const events=state.events.filter(e=>e.celebrationId===c.id);panel.innerHTML=`${context()}<div class="card"><div class="eyebrow">Programme</div><h2>Ajouter un rendez-vous</h2><p class="muted">Ce rendez-vous sera ajouté uniquement à Archange ${esc(c.archangel)} ${esc(c.year)}.</p><div class="form-grid"><label class="field"><span>Jour</span><select id="pDay">${days.map(d=>`<option value="${d.key}" data-date="${d.date}">${esc(d.label)}${d.date?' — '+formatDate(d.date,{day:'numeric',month:'long'}):''}</option>`).join('')}</select></label><label class="field"><span>Horaire</span><input id="pTime" type="time"></label><label class="field full"><span>Titre</span><input id="pTitle" placeholder="Ex. Office du matin"></label><label class="field"><span>Visible pour</span><select id="pGroup">${groupOptions()}</select></label><label class="field full"><span>Description facultative</span><textarea id="pDesc"></textarea></label></div><h3>Contenus associés</h3><p class="help">Cochez uniquement les contenus nécessaires pour ce rendez-vous.</p><div class="check-grid">${state.contents.length?state.contents.map(x=>`<label class="check"><input type="checkbox" name="content" value="${x.id}"><span><strong>${contentIcon(x.type)} ${esc(x.name)}</strong><br><span class="muted">${esc(x.type)} · ${esc(x.category||'Sans catégorie')}</span></span></label>`).join(''):'<div class="notice">La bibliothèque est vide. Créez d’abord un contenu dans « Médias & contenus ».</div>'}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="addEvent">Ajouter au programme</button><button class="btn" onclick="setTab('media')">Créer un contenu</button></div></div><div class="card section"><h2>Rendez-vous de cette célébration</h2><div class="list">${events.length?events.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||'')).map(e=>`<div class="admin-row"><div><strong>${esc(e.title)}</strong><div class="meta">${e.dayKey==='preparation'?'Préparation':formatDate(e.date)} · ${esc(e.time||'—')} · ${esc(groupName(state,e.audience))}</div><div class="muted">${(e.contentIds||[]).length} contenu(s) associé(s)</div></div><button class="btn danger" onclick="removeEvent(${e.id})">Supprimer</button></div>`).join(''):'<div class="notice">Aucun rendez-vous pour cette célébration.</div>'}</div></div>`;addEvent.onclick=()=>{const title=pTitle.value.trim();if(!title)return toast('Indiquez un titre');const opt=pDay.options[pDay.selectedIndex];state.events.push({id:Date.now(),celebrationId:c.id,dayKey:pDay.value,date:opt.dataset.date||'',time:pTime.value,title,audience:pGroup.value,description:pDesc.value,contentIds:[...document.querySelectorAll('input[name=content]:checked')].map(x=>+x.value)});saveState(state);renderProgram();toast('Rendez-vous ajouté')}}
function removeEvent(id){if(!confirm('Supprimer ce rendez-vous ?'))return;state.events=state.events.filter(e=>e.id!==id);saveState(state);renderProgram()}
function renderMedia(){panel.innerHTML=`<div class="card"><div class="eyebrow">Bibliothèque</div><h2>Ajouter un média ou un contenu</h2><p class="muted">Choisissez d’abord le type. Les champs proposés s’adaptent automatiquement.</p><div class="type-grid" id="types"><button class="type-card active" data-type="PDF">📄<br><strong>PDF</strong></button><button class="type-card" data-type="Audio">♫<br><strong>Audio</strong></button><button class="type-card" data-type="Texte">¶<br><strong>Texte</strong></button><button class="type-card" data-type="Vidéo">▶<br><strong>Vidéo</strong></button><button class="type-card" data-type="Lien">↗<br><strong>Lien</strong></button></div><div id="mediaForm" style="margin-top:18px"></div></div><div class="card section"><h2>Contenus existants</h2><div class="list">${state.contents.length?state.contents.map(c=>`<div class="admin-row"><div><strong>${contentIcon(c.type)} ${esc(c.name)}</strong><div class="meta">${esc(c.type)} · ${esc(c.category||'Sans catégorie')} · ${esc(groupName(state,c.audience))}</div></div><button class="btn danger" onclick="removeContent(${c.id})">Supprimer</button></div>`).join(''):'<div class="notice">Aucun contenu. Ajoutez votre premier média ci-dessus.</div>'}</div></div>`;let type='PDF';const choose=t=>{type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));renderMediaForm(t)};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>choose(b.dataset.type));renderMediaForm(type)}
function renderMediaForm(type){const common=`<div class="form-grid"><label class="field full"><span>Titre</span><input id="mTitle" placeholder="Titre visible pour les utilisateurs"></label><label class="field"><span>Catégorie</span><select id="mCategory">${categoryOptions(type==='PDF'?'PDF':type==='Audio'?'Audio':type==='Vidéo'?'Vidéos':type==='Texte'?'Textes':'')}</select></label><label class="field"><span>Visible pour</span><select id="mGroup">${groupOptions()}</select></label><label class="field full"><span>Description facultative</span><textarea id="mDesc"></textarea></label></div>`;let source='';if(type==='PDF')source=`<div class="field"><span>Fichier PDF</span><input id="mFile" type="file" accept="application/pdf,.pdf"></div>`;if(type==='Audio')source=`<label class="field"><span>Source audio</span><select id="mSource"><option value="file">Charger un fichier MP3 / audio</option><option value="url">Utiliser un lien</option></select></label><div id="sourceBox"></div>`;if(type==='Texte')source=`<label class="field"><span>Source du texte</span><select id="mSource"><option value="text">Écrire le texte ici</option><option value="file">Charger un fichier</option><option value="url">Utiliser un lien</option></select></label><div id="sourceBox"></div>`;if(type==='Vidéo')source=`<label class="field"><span>Lien de la vidéo</span><input id="mUrl" type="url" placeholder="https://..."></label><p class="help">Les vidéos sont ajoutées uniquement par lien.</p>`;if(type==='Lien')source=`<label class="field"><span>Lien</span><input id="mUrl" type="url" placeholder="https://..."></label>`;mediaForm.innerHTML=`${common}<div style="margin-top:14px">${source}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveMedia">Ajouter à la bibliothèque</button></div>`;if(type==='Audio'||type==='Texte'){const renderSource=()=>{const v=mSource.value;sourceBox.innerHTML=v==='file'?`<label class="field"><span>Fichier</span><input id="mFile" type="file" ${type==='Audio'?'accept="audio/*,.mp3"':'accept="text/*,.txt,.doc,.docx,.pdf"'}></label>`:v==='url'?`<label class="field"><span>Lien</span><input id="mUrl" type="url" placeholder="https://..."></label>`:`<label class="field"><span>Texte</span><textarea id="mText" placeholder="Saisissez le texte"></textarea></label>`};mSource.onchange=renderSource;renderSource()}saveMedia.onclick=()=>saveMediaItem(type)}
async function saveMediaItem(type){const title=mTitle.value.trim();if(!title)return toast('Indiquez un titre');const id=Date.now();let sourceType='url',url='',text='',file=null;if(type==='PDF'){sourceType='file';file=document.getElementById('mFile').files[0];if(!file)return toast('Choisissez un fichier PDF')}else if(type==='Audio'||type==='Texte'){sourceType=mSource.value;if(sourceType==='file'){file=document.getElementById('mFile').files[0];if(!file)return toast('Choisissez un fichier')}if(sourceType==='url'){url=document.getElementById('mUrl').value.trim();if(!url)return toast('Indiquez un lien')}if(sourceType==='text'){text=document.getElementById('mText').value.trim();if(!text)return toast('Saisissez le texte')}}else{url=mUrl.value.trim();if(!url)return toast('Indiquez un lien')}const item={id,name:title,type,category:mCategory.value||type,audience:mGroup.value,description:mDesc.value,sourceType,url,text,fileName:file?.name||'',mime:file?.type||''};if(file)try{await putMedia(id,file)}catch(e){return toast('Impossible d’enregistrer ce fichier sur cet appareil')}state.contents.push(item);saveState(state);renderMedia();toast('Contenu ajouté')}
async function removeContent(id){const c=state.contents.find(x=>x.id===id);if(!c||!confirm(`Supprimer « ${c.name} » ?`))return;state.contents=state.contents.filter(x=>x.id!==id);state.events.forEach(e=>e.contentIds=(e.contentIds||[]).filter(x=>x!==id));if(c.sourceType==='file')try{await deleteMedia(id)}catch(e){}saveState(state);renderMedia()}
function renderCategories(){panel.innerHTML=`<div class="card"><div class="eyebrow">Organisation</div><h2>Catégories</h2><p class="muted">Ajoutez uniquement les catégories utiles à votre bibliothèque.</p><div class="searchbar"><input id="catName" placeholder="Nouvelle catégorie"><button class="btn primary" id="addCat">Ajouter</button></div><div class="list">${state.categories.map(c=>`<div class="admin-row"><strong>${esc(c)}</strong><button class="btn danger" onclick="removeCategory('${c.replace(/'/g,"\\'")}')">Supprimer</button></div>`).join('')}</div></div>`;addCat.onclick=()=>{const n=catName.value.trim();if(!n)return;if(state.categories.some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Cette catégorie existe déjà');state.categories.push(n);saveState(state);renderCategories()}}
function removeCategory(name){if(state.contents.some(c=>c.category===name))return toast('Cette catégorie est utilisée par des contenus');if(!confirm(`Supprimer la catégorie « ${name} » ?`))return;state.categories=state.categories.filter(c=>c!==name);saveState(state);renderCategories()}
function renderGroups(){panel.innerHTML=`<div class="card"><div class="eyebrow">Visibilité</div><h2>Groupes</h2><p class="muted">Les groupes sont configurables. « Tous » reste la vue générale.</p><div class="searchbar"><input id="groupNameInput" placeholder="Nouveau groupe"><button class="btn primary" id="addGroup">Ajouter</button></div><div class="list">${state.groups.map(g=>`<div class="admin-row"><strong>${esc(g.name)}</strong>${g.id==='all'?'<span class="badge">Vue générale</span>':`<button class="btn danger" onclick="removeGroup('${esc(g.id)}')">Supprimer</button>`}</div>`).join('')}</div></div>`;addGroup.onclick=()=>{const n=groupNameInput.value.trim();if(!n)return;if(state.groups.some(g=>g.name.toLowerCase()===n.toLowerCase()))return toast('Ce groupe existe déjà');state.groups.push({id:'group-'+Date.now(),name:n});saveState(state);renderGroups()}}
function removeGroup(id){const g=state.groups.find(x=>x.id===id);if(!g||!confirm(`Supprimer le groupe « ${g.name} » ? Les éléments concernés deviendront visibles pour Tous.`))return;state.contents.forEach(c=>{if(c.audience===id)c.audience='all'});state.events.forEach(e=>{if(e.audience===id)e.audience='all'});state.groups=state.groups.filter(x=>x.id!==id);if(state.profile===id)state.profile='all';saveState(state);renderGroups()}
render();
</script></body></html>
