<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document — Célébrations</title><style>html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#f6f3ed;color:#222}#status{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}</style></head><body><div id="status">Ouverture du document…</div><script>(async()=>{const m=location.pathname.match(/^\/lettres\/([^/]+)\/?$/);if(!m){document.getElementById('status').innerHTML='<div><h1>Page introuvable</h1><p>Cette adresse n’existe pas.</p><p><a href="/">Retour au site</a></p></div>';return}const slug=decodeURIComponent(m[1]);const endpoint='https://jwyayfkssyagvnablttg.supabase.co/functions/v1/celebrations-committee-public?slug='+encodeURIComponent(slug);try{const r=await fetch(endpoint);if(!r.ok)throw new Error();const b=await r.blob(),u=URL.createObjectURL(new Blob([b],{type:b.type||'application/pdf'}));const f=document.createElement('iframe');f.src=u;f.title='Document PDF';document.body.innerHTML='';document.body.appendChild(f);addEventListener('beforeunload',()=>URL.revokeObjectURL(u),{once:true})}catch(e){document.getElementById('status').innerHTML='<div><h1>Document indisponible</h1><p>Le document demandé est introuvable ou momentanément indisponible.</p></div>'}})();</script></body></html>
