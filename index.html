<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Célébrations des Archanges</title>
<style>
:root{--accent:#b42318;--ink:#172033;--muted:#667085;--line:#e4e7ec;--soft:#f8fafc;--danger:#b42318;--radius:18px;--shadow:0 1px 2px rgba(16,24,40,.05)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top-inner{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 20px}.brand{font-weight:850;letter-spacing:-.02em}.nav,.actions,.chips,.row-actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.chip,.nav-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;color:var(--ink)}.btn:hover,.chip:hover,.nav-btn:hover{background:var(--soft)}.btn:focus-visible,.chip:focus-visible,.nav-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent),transparent 70%);outline-offset:2px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.danger{color:var(--danger);border-color:#f4c7c3}.btn.danger:hover{background:#fff5f4}.btn.small{padding:7px 10px;font-size:.86rem}.nav-btn.active,.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.container{max-width:1180px;margin:auto;padding:28px 20px 76px}.hero{display:grid;grid-template-columns:1.55fr .85fr;gap:20px}.card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:22px;box-shadow:var(--shadow)}.hero-main{border-top:5px solid var(--accent)}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.title{font-size:clamp(2.15rem,5vw,4rem);line-height:.98;letter-spacing:-.045em;margin:8px 0 12px}.date-range{font-weight:800;color:var(--accent);margin:0 0 14px}.lead,.muted,.help{color:var(--muted)}.help{font-size:.9rem}.section{margin-top:30px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.section-head h2,.card h2,.card h3{margin-top:0}.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}.day{white-space:nowrap;text-align:left}.day.active{background:var(--accent);border-color:var(--accent);color:#fff}.day .sub{display:block;font-size:.77rem;opacity:.8;margin-top:2px}.agenda,.list{display:grid;gap:12px}.event{display:grid;grid-template-columns:92px 1fr;gap:16px;border:1px solid var(--line);border-radius:16px;padding:18px}.time{font-size:1.2rem;font-weight:850}.meta{font-size:.9rem;color:var(--muted)}.resources{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.resource-link{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;font-size:.88rem}.filters{display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:flex;gap:8px;margin:14px 0}.searchbar input{flex:1}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.resource-card{border:1px solid var(--line);border-radius:16px;padding:16px}.resource-card h3{margin:6px 0}.resource-type{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;color:var(--ink)}textarea{min-height:100px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field>span{font-weight:700;font-size:.9rem}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}.check input{width:auto;margin-top:3px}.notice{border-left:4px solid var(--accent);background:var(--soft);padding:14px 16px;border-radius:0 12px 12px 0}.admin{margin-top:0}.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.admin-nav{display:grid;gap:8px;align-content:start;position:sticky;top:84px;height:max-content}.admin-nav .btn{text-align:left;border-radius:12px}.admin-nav .active{background:var(--ink);border-color:var(--ink);color:#fff}.admin-context{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft)}.admin-row{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:14px}.admin-row.selected{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:.76rem;font-weight:800;background:var(--soft);border:1px solid var(--line)}.badge.current{background:color-mix(in srgb,var(--accent),white 90%);border-color:color-mix(in srgb,var(--accent),white 70%);color:var(--accent)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:14px;padding:14px}.step strong{display:block;margin-bottom:4px}.footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--muted)}.footer-admin{margin-top:10px;font-size:.8rem;padding:7px 10px}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.danger-zone{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
@media(max-width:850px){.hero,.admin-layout,.grid3,.workflow{grid-template-columns:1fr}.admin-nav{position:static;grid-template-columns:repeat(2,1fr)}.form-grid,.check-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-inner{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav-btn{flex:1}.event{grid-template-columns:72px 1fr}.admin-row{align-items:flex-start;flex-direction:column}.row-actions{width:100%}.row-actions .btn{flex:1}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Célébrations des Archanges</div>
    <nav class="nav" aria-label="Navigation principale">
      <button class="nav-btn active" data-public-tab="program">Programme</button>
      <button class="nav-btn" data-public-tab="library">Bibliothèque</button>
      <button class="nav-btn" data-public-tab="info">Informations</button>
      <button class="nav-btn" id="langBtn" aria-label="Changer de langue">EN</button>
    </nav>
  </div>
</header>

<main class="container" id="main">
<section id="publicView">
  <div id="publicHeader"></div>
  <section id="publicProgram" class="section"></section>
  <section id="publicLibrary" class="section hidden"></section>
  <section id="publicInfo" class="section hidden"></section>
</section>

<section id="adminView" class="admin hidden">
  <div class="section-head">
    <div><div class="eyebrow">Administration</div><h1 style="margin:.2rem 0 0">Centre de gestion</h1></div>
    <button class="btn" id="backPublic">Voir le site public</button>
  </div>
  <div class="admin-layout">
    <nav class="admin-nav" aria-label="Navigation administration">
      <button class="btn active" data-admin="home">Accueil</button>
      <button class="btn" data-admin="celebrations">Célébrations</button>
      <button class="btn" data-admin="contents">Bibliothèque</button>
      <button class="btn" data-admin="categories">Catégories</button>
      <button class="btn" data-admin="groups">Groupes</button>
      <button class="btn" data-admin="backup">Sauvegarde</button>
    </nav>
    <div id="adminPanel"></div>
  </div>
</section>
</main>

<footer class="footer">
  Célébrations des Archanges
  <br><button class="btn footer-admin" id="adminEntry">Administration</button>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const ARCHANGELS={Michaël:'#b42318',Gabriel:'#173b70',Raphaël:'#16803c',Ouriel:'#d39e00'};
const DEFAULTS={
  version:3,language:'fr',currentCelebrationId:101,adminCelebrationId:101,profile:'all',publicTab:'program',libraryFilter:'Tous',activeDayKey:'preparation',
  groups:[{id:'all',name:'Tous'},{id:'angel',name:"Porteurs d’Ange"},{id:'nonangel',name:"Non-porteurs d’Ange"}],
  categories:['Audio','Textes','Vidéos','PDF'],
  celebrations:[
    {id:101,archangel:'Michaël',year:'2026',startDate:'2026-09-16',endDate:'2026-09-20',status:'active'},
    {id:102,archangel:'Gabriel',year:'2026–2027',startDate:'',endDate:'',status:'planned'},
    {id:103,archangel:'Raphaël',year:'2027',startDate:'',endDate:'',status:'planned'},
    {id:104,archangel:'Ouriel',year:'2028',startDate:'',endDate:'',status:'planned'}
  ],
  contents:[
    {id:1,name:'Livret de préparation',type:'PDF',category:'PDF',audience:'all',description:'Exemple de document à consulter avant la célébration.',url:''},
    {id:2,name:"Chant d’ouverture",type:'Audio',category:'Audio',audience:'all',description:'Exemple de fichier audio.',url:''},
    {id:3,name:'Psaume de préparation',type:'Texte',category:'Textes',audience:'angel',description:'Exemple de contenu destiné à un groupe.',url:''}
  ],
  events:[
    {id:1,celebrationId:101,dayKey:'preparation',date:'',time:'',title:'Préparer la célébration',audience:'all',contentIds:[1,3],description:''},
    {id:2,celebrationId:101,dayKey:'2026-09-16',date:'2026-09-16',time:'18:00',title:'Ouverture de la célébration',audience:'all',contentIds:[1,2],description:''},
    {id:3,celebrationId:101,dayKey:'2026-09-17',date:'2026-09-17',time:'08:00',title:'Office du matin',audience:'angel',contentIds:[2,3],description:''},
    {id:4,celebrationId:101,dayKey:'2026-09-18',date:'2026-09-18',time:'10:30',title:'Enseignement',audience:'all',contentIds:[],description:''},
    {id:5,celebrationId:101,dayKey:'2026-09-19',date:'2026-09-19',time:'18:00',title:'Célébration principale',audience:'all',contentIds:[1,2],description:''},
    {id:6,celebrationId:101,dayKey:'2026-09-20',date:'2026-09-20',time:'',title:'Clôture de la célébration',audience:'all',contentIds:[],description:''}
  ]
};

let raw=null;try{raw=JSON.parse(localStorage.getItem('celebrations-state')||'null')}catch(e){}
const state=migrate(raw);
function migrate(old){
  if(!old)return structuredClone(DEFAULTS);
  const s={...structuredClone(DEFAULTS),...old};
  if(!Array.isArray(s.groups)||!s.groups.length)s.groups=structuredClone(DEFAULTS.groups);
  if(typeof s.groups[0]==='string')s.groups=s.groups.map((name,i)=>({id:i===0?'all':'group-'+i,name}));
  if(!s.groups.some(g=>g.id==='all'))s.groups.unshift({id:'all',name:'Tous'});
  s.categories=Array.isArray(s.categories)?s.categories:[...DEFAULTS.categories];
  s.contents=Array.isArray(s.contents)?s.contents:structuredClone(DEFAULTS.contents);
  s.celebrations=Array.isArray(s.celebrations)?s.celebrations:structuredClone(DEFAULTS.celebrations);
  s.celebrations.forEach((c,i)=>{if(!c.id)c.id=1000+i;if(!c.archangel)c.archangel=(c.name||'').replace('Archange ','')||'Michaël'});
  if(Array.isArray(old.events))s.events=old.events;
  else if(Array.isArray(old.program))s.events=old.program.map(e=>({...e,celebrationId:e.celebrationId||101,dayKey:e.dayKey||(e.date||((e.day||'').toLowerCase()==='préparation'?'preparation':e.date||'preparation'))}));
  else s.events=structuredClone(DEFAULTS.events);
  s.events.forEach(e=>{if(!e.celebrationId)e.celebrationId=101;if(!e.dayKey)e.dayKey=e.date||'preparation';if(!Array.isArray(e.contentIds))e.contentIds=[]});
  if(!s.celebrations.some(c=>c.id===s.currentCelebrationId))s.currentCelebrationId=s.celebrations[0]?.id||null;
  if(!s.celebrations.some(c=>c.id===s.adminCelebrationId))s.adminCelebrationId=s.currentCelebrationId;
  if(!s.groups.some(g=>g.id===s.profile))s.profile='all';
  s.version=3;return s;
}
const save=()=>localStorage.setItem('celebrations-state',JSON.stringify(state));save();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(state.language==='en'?'en-GB':'fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const groupName=id=>state.groups.find(g=>g.id===id)?.name||'Tous';
const audienceOk=a=>state.profile==='all'||a==='all'||a===state.profile;
const celebration=id=>state.celebrations.find(c=>c.id===Number(id));
const activeCelebration=()=>celebration(state.currentCelebrationId)||state.celebrations[0];
const adminCelebration=()=>celebration(state.adminCelebrationId);
const colorFor=c=>ARCHANGELS[c?.archangel]||'#344054';
function dateKeys(c){
  const out=[{key:'preparation',label:state.language==='en'?'Preparation':'Préparation',sub:state.language==='en'?'Before the celebration':'Avant la célébration'}];
  if(!c?.startDate||!c?.endDate)return out;
  let d=new Date(c.startDate+'T12:00:00'), end=new Date(c.endDate+'T12:00:00'), guard=0;
  while(d<=end&&guard<31){const key=d.toISOString().slice(0,10);out.push({key,label:d.toLocaleDateString(state.language==='en'?'en-GB':'fr-FR',{weekday:'long'}),sub:d.toLocaleDateString(state.language==='en'?'en-GB':'fr-FR',{day:'numeric',month:'long'})});d.setDate(d.getDate()+1);guard++}
  return out;
}
function rangeText(c){
  if(!c?.startDate||!c?.endDate)return state.language==='en'?'Dates to be confirmed':'Dates à définir';
  const a=new Date(c.startDate+'T12:00:00'),b=new Date(c.endDate+'T12:00:00');
  if(state.language==='en')return `${a.toLocaleDateString('en-GB',{day:'numeric',month:'long'})} – ${b.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}`;
  return `Du ${a.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})} au ${b.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
}
function setAccent(c){document.documentElement.style.setProperty('--accent',colorFor(c))}
function renderPublic(){
  const c=activeCelebration();if(!c){publicHeader.innerHTML='<div class="card">Aucune célébration publiée.</div>';return}
  setAccent(c);
  publicHeader.innerHTML=`<div class="hero">
    <div class="card hero-main"><div class="eyebrow">${state.language==='en'?'Current celebration':'Célébration en cours'}</div>
      <h1 class="title">Archange ${esc(c.archangel)}<br>${esc(c.year)}</h1>
      <p class="date-range">${esc(rangeText(c))}</p>
      <p class="lead">${state.language==='en'?'Find the programme and resources for this celebration in one place.':'Retrouvez le programme et les ressources de cette célébration au même endroit.'}</p>
      <div class="chips" id="profileButtons"></div>
    </div>
    <div class="card"><div class="eyebrow">${state.language==='en'?'Quick access':'Accès rapide'}</div>
      <h2>${state.language==='en'?'What do I need today?':"De quoi ai-je besoin aujourd’hui ?"}</h2>
      <p class="muted">${state.language==='en'?'Choose your group, then the day. Only relevant items are shown.':'Choisissez votre groupe puis le jour. Seuls les éléments qui vous concernent sont affichés.'}</p>
      <button class="btn primary" onclick="setPublicTab('program')">${state.language==='en'?'View programme':'Voir le programme'}</button>
    </div></div>`;
  renderProfiles();renderProgram();renderLibrary();renderInfo();setPublicTab(state.publicTab,false)
}
function renderProfiles(){
  const box=document.getElementById('profileButtons');if(!box)return;
  box.innerHTML=state.groups.map(g=>`<button class="chip ${state.profile===g.id?'active':''}" data-profile="${esc(g.id)}">${g.id==='all'?(state.language==='en'?'Show all':'Voir tout'):esc(g.name)}</button>`).join('');
  box.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{state.profile=b.dataset.profile;save();renderProfiles();renderProgram();renderLibrary()})
}
function renderProgram(){
  const c=activeCelebration();if(!c)return;const keys=dateKeys(c);if(!keys.some(x=>x.key===state.activeDayKey))state.activeDayKey=keys[0].key;
  const events=state.events.filter(e=>e.celebrationId===c.id&&e.dayKey===state.activeDayKey&&audienceOk(e.audience)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  publicProgram.innerHTML=`<div class="section-head"><div><div class="eyebrow">${state.language==='en'?'Programme':'Programme'}</div><h2>${state.language==='en'?'Choose a day':'Choisissez un jour'}</h2></div><span class="help">${esc(groupName(state.profile))}</span></div>
  <div class="days" role="tablist">${keys.map(k=>`<button role="tab" aria-selected="${k.key===state.activeDayKey}" class="btn day ${k.key===state.activeDayKey?'active':''}" data-day="${k.key}">${esc(k.label)}<span class="sub">${esc(k.sub)}</span></button>`).join('')}</div>
  <div class="agenda">${events.length?events.map(eventCard).join(''):`<div class="card muted">${state.language==='en'?'Nothing scheduled for this day.':'Aucun rendez-vous prévu pour ce jour.'}</div>`}</div>`;
  publicProgram.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.activeDayKey=b.dataset.day;save();renderProgram()})
}
function eventCard(e){
  const resources=e.contentIds.map(id=>state.contents.find(c=>c.id===id)).filter(Boolean).filter(c=>audienceOk(c.audience));
  return `<article class="event"><div class="time">${esc(e.time||'—')}</div><div><h3>${esc(e.title)}</h3>${e.description?`<p class="muted">${esc(e.description)}</p>`:''}<div class="meta">${e.date?esc(fmtDate(e.date)):(state.language==='en'?'Preparation':'Préparation')} · ${esc(groupName(e.audience))}</div>
  ${resources.length?`<div class="resources">${resources.map(c=>`<button class="resource-link" onclick="openContent(${c.id})">${icon(c.type)} ${esc(c.name)}</button>`).join('')}</div>`:''}</div></article>`
}
const icon=t=>t==='Audio'?'♫':t==='Vidéo'?'▶':t==='PDF'?'📄':t==='Texte'?'📖':'↗';
function openContent(id){const c=state.contents.find(x=>x.id===id);if(!c)return;if(c.url){window.open(c.url,'_blank','noopener')}else toast((state.language==='en'?'Resource: ':'Contenu : ')+c.name)}
function renderLibrary(){
  const cats=['Tous',...state.categories];if(!cats.includes(state.libraryFilter))state.libraryFilter='Tous';
  const q=(document.getElementById('publicSearch')?.value||'').toLowerCase();
  const list=state.contents.filter(c=>audienceOk(c.audience)).filter(c=>state.libraryFilter==='Tous'||c.category===state.libraryFilter).filter(c=>!q||`${c.name} ${c.description||''} ${c.category}`.toLowerCase().includes(q));
  publicLibrary.innerHTML=`<div class="section-head"><div><div class="eyebrow">${state.language==='en'?'Resource library':'Bibliothèque'}</div><h2>${state.language==='en'?'All resources':'Tous les contenus'}</h2></div></div>
  <div class="searchbar"><input id="publicSearch" value="${esc(document.getElementById('publicSearch')?.value||'')}" placeholder="${state.language==='en'?'Search resources…':'Rechercher un contenu…'}"></div>
  <div class="filters">${cats.map(x=>`<button class="chip ${state.libraryFilter===x?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <div class="grid3" style="margin-top:14px">${list.length?list.map(c=>`<article class="resource-card"><div class="resource-type">${esc(c.type)} · ${esc(c.category)}</div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.description||'')}</p><div class="meta">${esc(groupName(c.audience))}</div><div class="resources"><button class="resource-link" onclick="openContent(${c.id})">${state.language==='en'?'Open':'Ouvrir'}</button></div></article>`).join(''):`<div class="card muted">${state.language==='en'?'No matching resource.':'Aucun contenu correspondant.'}</div>`}</div>`;
  document.getElementById('publicSearch').oninput=renderLibrary;
  publicLibrary.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.libraryFilter=b.dataset.filter;save();renderLibrary()})
}
function renderInfo(){
  const c=activeCelebration();publicInfo.innerHTML=`<div class="card"><div class="eyebrow">${state.language==='en'?'Information':'Informations'}</div><h2>Archange ${esc(c.archangel)} ${esc(c.year)}</h2><p class="muted">${esc(rangeText(c))}</p><p>${state.language==='en'?'This space can contain practical information, instructions, contacts or access details for the celebration.':'Cet espace peut contenir les informations pratiques, consignes, contacts ou modalités d’accès de la célébration.'}</p></div>`
}
function setPublicTab(tab,scroll=true){
  state.publicTab=tab;save();publicProgram.classList.toggle('hidden',tab!=='program');publicLibrary.classList.toggle('hidden',tab!=='library');publicInfo.classList.toggle('hidden',tab!=='info');
  document.querySelectorAll('[data-public-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.publicTab===tab);b.setAttribute('aria-current',b.dataset.publicTab===tab?'page':'false')});
  if(scroll)document.getElementById(tab==='program'?'publicProgram':tab==='library'?'publicLibrary':'publicInfo').scrollIntoView({behavior:'smooth',block:'start'})
}
document.querySelectorAll('[data-public-tab]').forEach(b=>b.onclick=()=>setPublicTab(b.dataset.publicTab));
langBtn.onclick=()=>{state.language=state.language==='fr'?'en':'fr';langBtn.textContent=state.language==='fr'?'EN':'FR';save();renderPublic()};
langBtn.textContent=state.language==='fr'?'EN':'FR';

function showAdmin(){publicView.classList.add('hidden');adminView.classList.remove('hidden');renderAdmin('home');window.scrollTo({top:0,behavior:'smooth'})}
function showPublic(){adminView.classList.add('hidden');publicView.classList.remove('hidden');renderPublic();window.scrollTo({top:0,behavior:'smooth'})}
adminEntry.onclick=showAdmin;backPublic.onclick=showPublic;
document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>adminNavigate(b.dataset.admin));
function adminNavigate(key){
  document.querySelectorAll('[data-admin]').forEach(b=>{b.classList.toggle('active',b.dataset.admin===key);b.setAttribute('aria-current',b.dataset.admin===key?'page':'false')});
  renderAdmin(key)
}
function contextBar(extra=''){
  const c=adminCelebration();return c?`<div class="admin-context"><div><span class="badge current">Célébration sélectionnée</span> <strong>Archange ${esc(c.archangel)} ${esc(c.year)}</strong><div class="help">${esc(rangeText(c))}</div></div><div class="actions">${extra}<button class="btn small" onclick="adminNavigate('celebrations')">Changer</button></div></div>`:''
}
function renderAdmin(key){
  const p=adminPanel;
  if(key==='home')return renderAdminHome(p);
  if(key==='celebrations')return renderCelebrations(p);
  if(key==='contents')return renderContents(p);
  if(key==='categories')return renderCategories(p);
  if(key==='groups')return renderGroups(p);
  if(key==='backup')return renderBackup(p);
  if(key==='workspace')return renderWorkspace(p);
}
function renderAdminHome(p){
  const c=adminCelebration();
  p.innerHTML=`${contextBar(c?`<button class="btn small primary" onclick="adminNavigate('workspace')">Ouvrir</button>`:'')}<div class="card"><div class="eyebrow">Mode d’emploi</div><h2>Un parcours simple en 4 étapes</h2><div class="workflow">
  <div class="step"><strong>1. Célébration</strong><span class="help">Créez la célébration et choisissez ses dates.</span></div>
  <div class="step"><strong>2. Bibliothèque</strong><span class="help">Ajoutez les PDF, audios, vidéos, textes et liens une seule fois.</span></div>
  <div class="step"><strong>3. Programme</strong><span class="help">Ouvrez la célébration puis placez ses rendez-vous et associez les contenus.</span></div>
  <div class="step"><strong>4. Publication</strong><span class="help">Définissez la célébration courante affichée au public.</span></div></div></div>
  <div class="grid3 section"><div class="card"><div class="eyebrow">Célébrations</div><h2>${state.celebrations.length}</h2><button class="btn" onclick="adminNavigate('celebrations')">Gérer</button></div><div class="card"><div class="eyebrow">Contenus</div><h2>${state.contents.length}</h2><button class="btn" onclick="adminNavigate('contents')">Gérer</button></div><div class="card"><div class="eyebrow">Groupes</div><h2>${state.groups.length}</h2><button class="btn" onclick="adminNavigate('groups')">Gérer</button></div></div>`
}
function renderCelebrations(p){
  p.innerHTML=`<div class="card"><div class="section-head"><div><div class="eyebrow">Célébrations</div><h2>Choisir ou créer une célébration</h2><p class="help">Cliquez sur « Gérer » pour entrer dans une célébration et modifier son programme.</p></div></div>
  <div class="list">${state.celebrations.map(c=>`<div class="admin-row ${c.id===state.adminCelebrationId?'selected':''}"><div><strong>Archange ${esc(c.archangel)} ${esc(c.year)}</strong> ${c.id===state.currentCelebrationId?'<span class="badge current">Publiée</span>':''}<div class="help">${esc(rangeText(c))} · ${state.events.filter(e=>e.celebrationId===c.id).length} rendez-vous</div></div><div class="row-actions"><button class="btn primary" onclick="manageCelebration(${c.id})">Gérer</button>${c.id!==state.currentCelebrationId?`<button class="btn" onclick="publishCelebration(${c.id})">Afficher au public</button>`:''}<button class="btn" onclick="duplicateCelebration(${c.id})">Dupliquer</button><button class="btn danger" onclick="deleteCelebration(${c.id})">Supprimer</button></div></div>`).join('')}</div></div>
  <div class="card section"><h3>Ajouter une célébration</h3><div class="form-grid"><label class="field"><span>Archange</span><select id="newArch">${Object.keys(ARCHANGELS).map(a=>`<option>${a}</option>`).join('')}</select></label><label class="field"><span>Année / période</span><input id="newYear" placeholder="Ex. 2029"></label><label class="field"><span>Date de début</span><input id="newStart" type="date"></label><label class="field"><span>Date de fin</span><input id="newEnd" type="date"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="createCelebration">Créer et gérer</button></div></div>`;
  createCelebration.onclick=()=>{const year=newYear.value.trim();if(!year)return toast('Indiquez une année ou une période');if(newStart.value&&newEnd.value&&newEnd.value<newStart.value)return toast('La date de fin doit être après le début');const id=Date.now();state.celebrations.push({id,archangel:newArch.value,year,startDate:newStart.value,endDate:newEnd.value,status:'planned'});state.adminCelebrationId=id;save();toast('Célébration créée');renderWorkspace(p)}
}
function manageCelebration(id){state.adminCelebrationId=id;save();adminNavigate('workspace')}
function publishCelebration(id){state.currentCelebrationId=id;state.profile='all';state.activeDayKey='preparation';save();toast('Célébration affichée sur le site public');renderCelebrations(adminPanel)}
function duplicateCelebration(id){
  const src=celebration(id);if(!src)return;const year=prompt('Année ou période de la nouvelle célébration :','');if(!year)return;const nid=Date.now();state.celebrations.push({...src,id:nid,year,startDate:'',endDate:'',status:'planned'});state.events.filter(e=>e.celebrationId===id).forEach((e,i)=>state.events.push({...e,id:nid+i+1,celebrationId:nid,date:'',dayKey:'preparation'}));state.adminCelebrationId=nid;save();toast('Célébration dupliquée');renderCelebrations(adminPanel)
}
function deleteCelebration(id){const c=celebration(id);if(!c)return;if(id===state.currentCelebrationId)return toast('Choisissez d’abord une autre célébration à afficher au public');if(!confirm(`Supprimer Archange ${c.archangel} ${c.year} et tout son programme ?`))return;state.celebrations=state.celebrations.filter(x=>x.id!==id);state.events=state.events.filter(e=>e.celebrationId!==id);if(state.adminCelebrationId===id)state.adminCelebrationId=state.currentCelebrationId;save();renderCelebrations(adminPanel);toast('Célébration supprimée')}
function renderWorkspace(p){
  const c=adminCelebration();if(!c)return renderCelebrations(p);
  setAccent(c);
  p.innerHTML=`${contextBar(`<button class="btn small" onclick="previewSelected()">Aperçu public</button>`)}
  <div class="card"><div class="section-head"><div><div class="eyebrow">Dans cette célébration</div><h2>Archange ${esc(c.archangel)} ${esc(c.year)}</h2></div></div>
  <div class="notice"><strong>Vous travaillez uniquement sur cette célébration.</strong><div class="help">Les rendez-vous créés ici n’apparaîtront pas dans les autres célébrations. Les contenus de la Bibliothèque, eux, peuvent être réutilisés.</div></div>
  <div class="actions" style="margin-top:16px"><button class="btn" onclick="editCelebration(${c.id})">Dates et informations</button><button class="btn primary" onclick="renderProgramManager()">Programme et contenus associés</button></div>
  <div id="workspaceBody" class="section"></div></div>`;
  renderProgramManager()
}
function previewSelected(){state.currentCelebrationId=state.adminCelebrationId;state.activeDayKey='preparation';save();showPublic();toast('Aperçu de la célébration sélectionnée')}
function editCelebration(id){
  const c=celebration(id),box=document.getElementById('workspaceBody');if(!c||!box)return;
  box.innerHTML=`<h3>Dates et informations</h3><div class="form-grid"><label class="field"><span>Archange</span><select id="editArch">${Object.keys(ARCHANGELS).map(a=>`<option ${a===c.archangel?'selected':''}>${a}</option>`).join('')}</select></label><label class="field"><span>Année / période</span><input id="editYear" value="${esc(c.year)}"></label><label class="field"><span>Date de début</span><input id="editStart" type="date" value="${esc(c.startDate)}"></label><label class="field"><span>Date de fin</span><input id="editEnd" type="date" value="${esc(c.endDate)}"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveCelebration">Enregistrer</button><button class="btn" onclick="renderProgramManager()">Annuler</button></div>`;
  saveCelebration.onclick=()=>{if(editStart.value&&editEnd.value&&editEnd.value<editStart.value)return toast('Vérifiez les dates');c.archangel=editArch.value;c.year=editYear.value.trim()||c.year;c.startDate=editStart.value;c.endDate=editEnd.value;save();toast('Célébration mise à jour');renderWorkspace(adminPanel)}
}
function renderProgramManager(editId=null){
  const c=adminCelebration(),box=document.getElementById('workspaceBody');if(!c||!box)return;
  const keys=dateKeys(c),existing=editId?state.events.find(e=>e.id===editId):null;
  box.innerHTML=`<div class="section-head"><div><h3>Programme</h3><p class="help">Ajoutez les rendez-vous dans l’ordre de la célébration et associez les contenus déjà présents dans la Bibliothèque.</p></div></div>
  <div class="card" style="box-shadow:none"><h3>${existing?'Modifier le rendez-vous':'Ajouter un rendez-vous'}</h3>
  <div class="form-grid"><label class="field"><span>Jour / phase</span><select id="eventDay">${keys.map(k=>`<option value="${k.key}" ${existing?.dayKey===k.key?'selected':''}>${esc(k.label)} — ${esc(k.sub)}</option>`).join('')}</select></label><label class="field"><span>Horaire</span><input id="eventTime" type="time" value="${esc(existing?.time||'')}"></label><label class="field full"><span>Titre</span><input id="eventTitle" value="${esc(existing?.title||'')}" placeholder="Ex. Office du matin"></label><label class="field full"><span>Description facultative</span><textarea id="eventDesc">${esc(existing?.description||'')}</textarea></label><label class="field"><span>Visible pour</span><select id="eventAudience">${groupOptions(existing?.audience||'all')}</select></label></div>
  <div style="margin-top:14px"><strong>Contenus associés</strong><p class="help">Cochez un ou plusieurs contenus. Vous pouvez en créer d’autres dans Bibliothèque.</p><div class="check-grid">${state.contents.length?state.contents.map(x=>`<label class="check"><input type="checkbox" name="eventContent" value="${x.id}" ${(existing?.contentIds||[]).includes(x.id)?'checked':''}><span><strong>${esc(x.name)}</strong><br><span class="help">${esc(x.type)} · ${esc(x.category)}</span></span></label>`).join(''):'<div class="help">Aucun contenu dans la Bibliothèque.</div>'}</div></div>
  <div class="actions" style="margin-top:14px"><button class="btn primary" id="saveEvent">${existing?'Enregistrer les modifications':'Ajouter au programme'}</button>${existing?'<button class="btn" onclick="renderProgramManager()">Annuler</button>':''}<button class="btn" onclick="adminNavigate('contents')">Aller à la Bibliothèque</button></div></div>
  <div class="list section">${state.events.filter(e=>e.celebrationId===c.id).sort(sortEvents).map(e=>`<div class="admin-row"><div><strong>${esc(labelForDay(c,e.dayKey))}${e.time?' · '+esc(e.time):''} — ${esc(e.title)}</strong><div class="help">${esc(groupName(e.audience))} · ${(e.contentIds||[]).length} contenu(s) associé(s)</div></div><div class="row-actions"><button class="btn" onclick="renderProgramManager(${e.id})">Modifier</button><button class="btn danger" onclick="deleteEvent(${e.id})">Supprimer</button></div></div>`).join('')||'<div class="notice">Aucun rendez-vous pour cette célébration.</div>'}</div>`;
  saveEvent.onclick=()=>{const title=eventTitle.value.trim();if(!title)return toast('Ajoutez un titre');const dayKey=eventDay.value;const obj=existing||{id:Date.now(),celebrationId:c.id,contentIds:[]};obj.dayKey=dayKey;obj.date=dayKey==='preparation'?'':dayKey;obj.time=eventTime.value;obj.title=title;obj.description=eventDesc.value.trim();obj.audience=eventAudience.value;obj.contentIds=[...document.querySelectorAll('input[name="eventContent"]:checked')].map(x=>Number(x.value));if(!existing)state.events.push(obj);save();toast(existing?'Rendez-vous modifié':'Rendez-vous ajouté');renderProgramManager()}
}
function sortEvents(a,b){if(a.dayKey==='preparation')return -1;if(b.dayKey==='preparation')return 1;return `${a.dayKey} ${a.time||'99:99'}`.localeCompare(`${b.dayKey} ${b.time||'99:99'}`)}
function labelForDay(c,key){const k=dateKeys(c).find(x=>x.key===key);return k?k.label+(key==='preparation'?'':' '+k.sub):key}
function deleteEvent(id){const e=state.events.find(x=>x.id===id);if(!e||!confirm(`Supprimer « ${e.title} » ?`))return;state.events=state.events.filter(x=>x.id!==id);save();renderProgramManager();toast('Rendez-vous supprimé')}
function groupOptions(selected='all'){return state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')}

function renderContents(p,editId=null){
  const e=editId?state.contents.find(x=>x.id===editId):null;
  p.innerHTML=`<div class="card"><div class="section-head"><div><div class="eyebrow">Bibliothèque commune</div><h2>${e?'Modifier un contenu':'Ajouter un contenu'}</h2><p class="help">Un contenu est créé une seule fois puis peut être associé à plusieurs rendez-vous et célébrations.</p></div></div>
  <div class="form-grid"><label class="field full"><span>Nom</span><input id="contentName" value="${esc(e?.name||'')}"></label><label class="field"><span>Type</span><select id="contentType">${['PDF','Audio','Vidéo','Texte','Lien'].map(x=>`<option ${e?.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Catégorie</span><select id="contentCategory">${state.categories.map(x=>`<option ${e?.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field"><span>Visible pour</span><select id="contentAudience">${groupOptions(e?.audience||'all')}</select></label><label class="field"><span>Fichier / URL</span><input id="contentUrl" value="${esc(e?.url||'')}" placeholder="https://… ou chemin du fichier"></label><label class="field full"><span>Description facultative</span><textarea id="contentDesc">${esc(e?.description||'')}</textarea></label></div>
  <div class="actions" style="margin-top:14px"><button class="btn primary" id="saveContent">${e?'Enregistrer':'Ajouter à la Bibliothèque'}</button>${e?'<button class="btn" onclick="renderContents(adminPanel)">Annuler</button>':''}</div></div>
  <div class="list section">${state.contents.map(c=>`<div class="admin-row"><div><strong>${esc(c.name)}</strong><div class="help">${esc(c.type)} · ${esc(c.category)} · ${esc(groupName(c.audience))} · utilisé dans ${state.events.filter(ev=>(ev.contentIds||[]).includes(c.id)).length} rendez-vous</div></div><div class="row-actions"><button class="btn" onclick="renderContents(adminPanel,${c.id})">Modifier</button><button class="btn danger" onclick="deleteContent(${c.id})">Supprimer</button></div></div>`).join('')}</div>`;
  saveContent.onclick=()=>{const name=contentName.value.trim();if(!name)return toast('Ajoutez un nom');const obj=e||{id:Date.now()};Object.assign(obj,{name,type:contentType.value,category:contentCategory.value,audience:contentAudience.value,url:contentUrl.value.trim(),description:contentDesc.value.trim()});if(!e)state.contents.push(obj);save();toast(e?'Contenu modifié':'Contenu ajouté');renderContents(adminPanel)}
}
function deleteContent(id){const c=state.contents.find(x=>x.id===id);if(!c)return;const uses=state.events.filter(e=>(e.contentIds||[]).includes(id)).length;if(!confirm(`Supprimer « ${c.name} » ?${uses?` Il sera aussi retiré de ${uses} rendez-vous.`:''}`))return;state.contents=state.contents.filter(x=>x.id!==id);state.events.forEach(e=>e.contentIds=(e.contentIds||[]).filter(x=>x!==id));save();renderContents(adminPanel);toast('Contenu supprimé')}

function renderCategories(p){
  p.innerHTML=`<div class="card"><div class="eyebrow">Organisation</div><h2>Catégories</h2><p class="help">Les catégories organisent la Bibliothèque. Supprimer une catégorie utilisée est bloqué tant que des contenus y sont rangés.</p><div class="searchbar"><input id="newCategory" placeholder="Nouvelle catégorie"><button class="btn primary" id="addCategory">Ajouter</button></div><div class="list">${state.categories.map(c=>`<div class="admin-row"><div><strong>${esc(c)}</strong><div class="help">${state.contents.filter(x=>x.category===c).length} contenu(s)</div></div><button class="btn danger" onclick="deleteCategory('${esc(c).replace(/&#039;/g,"\\'")}')">Supprimer</button></div>`).join('')}</div></div>`;
  addCategory.onclick=()=>{const v=newCategory.value.trim();if(!v)return toast('Entrez un nom');if(state.categories.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('Cette catégorie existe déjà');state.categories.push(v);save();renderCategories(p);toast('Catégorie ajoutée')}
}
function deleteCategory(name){const used=state.contents.filter(c=>c.category===name).length;if(used)return toast(`Impossible : ${used} contenu(s) utilisent encore cette catégorie`);if(!confirm(`Supprimer la catégorie « ${name} » ?`))return;state.categories=state.categories.filter(x=>x!==name);save();renderCategories(adminPanel);toast('Catégorie supprimée')}

function renderGroups(p){
  p.innerHTML=`<div class="card"><div class="eyebrow">Visibilité</div><h2>Groupes de visiteurs</h2><p class="help">Les groupes sont configurables. « Tous » reste la vue générale nécessaire au site.</p><div class="searchbar"><input id="newGroup" placeholder="Nouveau groupe"><button class="btn primary" id="addGroup">Ajouter</button></div><div class="list">${state.groups.map(g=>`<div class="admin-row"><div><strong>${esc(g.name)}</strong><div class="help">${state.contents.filter(c=>c.audience===g.id).length} contenu(s) · ${state.events.filter(e=>e.audience===g.id).length} rendez-vous</div></div>${g.id==='all'?'<span class="badge">Obligatoire</span>':`<button class="btn danger" onclick="deleteGroup('${esc(g.id)}')">Supprimer</button>`}</div>`).join('')}</div></div>`;
  addGroup.onclick=()=>{const name=newGroup.value.trim();if(!name)return toast('Entrez un nom');if(state.groups.some(g=>g.name.toLowerCase()===name.toLowerCase()))return toast('Ce groupe existe déjà');state.groups.push({id:'group-'+Date.now(),name});save();renderGroups(p);toast('Groupe ajouté')}
}
function deleteGroup(id){const g=state.groups.find(x=>x.id===id);if(!g||id==='all')return;const uses=state.contents.filter(c=>c.audience===id).length+state.events.filter(e=>e.audience===id).length;if(!confirm(`Supprimer « ${g.name} » ?${uses?` ${uses} élément(s) deviendront visibles pour Tous.`:''}`))return;state.contents.forEach(c=>{if(c.audience===id)c.audience='all'});state.events.forEach(e=>{if(e.audience===id)e.audience='all'});state.groups=state.groups.filter(x=>x.id!==id);if(state.profile===id)state.profile='all';save();renderGroups(adminPanel);toast('Groupe supprimé')}

function renderBackup(p){
  p.innerHTML=`<div class="card"><div class="eyebrow">Sécurité</div><h2>Sauvegarde des données</h2><p class="help">Ce prototype enregistre encore les données dans ce navigateur. Exportez régulièrement une copie JSON. La prochaine étape technique sera un vrai backend partagé avec comptes administrateurs et fichiers.</p><div class="actions"><button class="btn primary" id="exportData">Exporter les données</button><label class="btn">Importer une sauvegarde<input class="sr-only" type="file" id="importData" accept="application/json"></label><button class="btn danger" id="resetDemo">Réinitialiser le prototype</button></div></div>`;
  exportData.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='celebrations-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)};
  importData.onchange=async()=>{const f=importData.files[0];if(!f)return;try{const data=JSON.parse(await f.text());localStorage.setItem('celebrations-state',JSON.stringify(migrate(data)));location.reload()}catch(e){toast('Fichier de sauvegarde invalide')}};
  resetDemo.onclick=()=>{if(confirm('Réinitialiser toutes les données locales de ce prototype ?')){localStorage.removeItem('celebrations-state');location.reload()}}
}

renderPublic();
</script>
</body>
</html>
