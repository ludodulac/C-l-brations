<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Célébrations des Archanges</title><style>
:root{--red:#b42318;--green:#16803c;--blue:#173b70;--yellow:#e1b800;--ink:#172033;--muted:#667085;--line:#e7e9ee;--soft:#f7f8fa}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.bar,.container{max-width:1120px;margin:auto;padding:16px 20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800}.nav,.actions,.chips{display:flex;gap:8px;flex-wrap:wrap}.btn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.btn:hover,.chip:hover{background:var(--soft)}.primary{background:var(--ink);border-color:var(--ink);color:#fff}.danger{color:#b42318;border-color:#f2b8b5}.card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}.hero{border-top:5px solid var(--red)}h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:8px 0}.muted,.small{color:var(--muted)}.small{font-size:.88rem}.section{margin-top:26px}.days{display:flex;gap:8px;overflow:auto}.day{white-space:nowrap}.day.active{background:var(--red);color:#fff;border-color:var(--red)}.agenda,.list{display:grid;gap:10px;margin-top:14px}.row{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.slot{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:80px 1fr;gap:12px}.time{font-weight:800;font-size:1.15rem}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hidden{display:none!important}.admin{border-top:1px solid var(--line);margin-top:25px;padding-top:25px}.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.admin-nav{display:grid;gap:8px;align-content:start}.admin-nav .active{background:var(--ink);color:#fff}.selected{border:2px solid var(--ink);background:var(--soft)}.selected-banner{padding:14px 16px;border-radius:14px;background:var(--soft);margin-bottom:14px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.footer{margin-top:50px;border-top:1px solid var(--line);padding:24px;text-align:center;color:var(--muted)}@media(max-width:760px){.admin-layout,.library,.form{grid-template-columns:1fr}.full{grid-column:auto}.bar,.row{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}}
</style></head><body>
<header class="top"><div class="bar"><div class="brand">Célébrations des Archanges</div><div class="nav"><button class="btn" id="goProgram">Programme</button><button class="btn" id="goLibrary">Bibliothèque</button></div></div></header>
<main class="container"><section id="publicView"><div class="card hero"><div class="small">CÉLÉBRATION EN COURS</div><h1>Archange Michaël<br>2026</h1><p><strong>Du mercredi 16 au dimanche 20 septembre 2026</strong></p><p class="muted">Programme et contenus de la célébration.</p><div class="chips" id="profiles"></div></div><div class="section" id="programSection"><h2>Programme</h2><div class="days" id="days"></div><div class="agenda" id="agenda"></div></div><div class="section" id="librarySection"><h2>Bibliothèque</h2><div class="library" id="library"></div></div></section>
<section id="adminView" class="admin hidden"><div class="actions" style="justify-content:space-between"><div><div class="small">ADMINISTRATION</div><h2 style="margin:4px 0 16px">Gérer le site</h2></div><button class="btn" id="back">Voir le site</button></div><div class="admin-layout"><nav class="admin-nav"><button class="btn active" data-admin="celebrations">1. Célébrations</button><button class="btn" data-admin="program">2. Programme</button><button class="btn" data-admin="contents">Contenus</button><button class="btn" data-admin="categories">Catégories</button><button class="btn" data-admin="groups">Groupes</button></nav><div id="panel"></div></div></section></main>
<footer class="footer">Célébrations des Archanges<br><button class="btn" style="margin-top:12px" id="adminButton">Administration</button></footer>
<script>
const defaults={selectedCelebrationId:101,profile:'all',activeDay:'Préparation',groups:[{id:'all',name:'Tous'},{id:'angel',name:'Porteurs d’Ange'},{id:'nonangel',name:'Non-porteurs d’Ange'}],categories:['Audio','Textes','Vidéos','PDF'],celebrations:[{id:101,name:'Archange Michaël',year:'2026',archangel:'Michaël',startDate:'2026-09-16',endDate:'2026-09-20'},{id:102,name:'Archange Gabriel',year:'2026–2027',archangel:'Gabriel',startDate:'',endDate:''},{id:103,name:'Archange Raphaël',year:'2027',archangel:'Raphaël',startDate:'',endDate:''},{id:104,name:'Archange Ouriel',year:'2028',archangel:'Ouriel',startDate:'',endDate:''}],contents:[{id:1,name:'Livret de préparation',type:'PDF',category:'Textes',audience:'all',description:'Exemple de document.'},{id:2,name:'Chant d’ouverture',type:'Audio',category:'Audio',audience:'all',description:'Exemple de fichier MP3.'}],program:[{id:1,celebrationId:101,day:'Préparation',date:'',time:'À faire',title:'Préparer la célébration',audience:'all',contentIds:[1]},{id:2,celebrationId:101,day:'Mercredi',date:'2026-09-16',time:'18:00',title:'Ouverture de la célébration',audience:'all',contentIds:[1,2]},{id:3,celebrationId:101,day:'Jeudi',date:'2026-09-17',time:'08:00',title:'Office du matin',audience:'all',contentIds:[2]},{id:4,celebrationId:101,day:'Vendredi',date:'2026-09-18',time:'10:30',title:'Enseignement',audience:'all',contentIds:[]},{id:5,celebrationId:101,day:'Samedi',date:'2026-09-19',time:'18:00',title:'Célébration principale',audience:'all',contentIds:[1,2]},{id:6,celebrationId:101,day:'Dimanche',date:'2026-09-20',time:'—',title:'Clôture de la célébration',audience:'all',contentIds:[]}]};
let old=null;try{old=JSON.parse(localStorage.getItem('celebrations-state')||'null')}catch(e){}const s=old||structuredClone(defaults);s.celebrations=Array.isArray(s.celebrations)?s.celebrations:structuredClone(defaults.celebrations);s.contents=Array.isArray(s.contents)?s.contents:structuredClone(defaults.contents);s.program=Array.isArray(s.program)?s.program:structuredClone(defaults.program);s.categories=Array.isArray(s.categories)?s.categories:[...defaults.categories];if(!Array.isArray(s.groups)||!s.groups.length)s.groups=structuredClone(defaults.groups);if(typeof s.groups[0]==='string')s.groups=s.groups.map((n,i)=>({id:i===0?'all':'group-'+i,name:n}));s.selectedCelebrationId=s.selectedCelebrationId||101;s.program.forEach(p=>{if(!p.celebrationId)p.celebrationId=101});const save=()=>localStorage.setItem('celebrations-state',JSON.stringify(s));save();
const selected=()=>s.celebrations.find(c=>c.id===s.selectedCelebrationId);const groupName=id=>s.groups.find(g=>g.id===id)?.name||'Tous';const groupOptions=()=>s.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');const esc=x=>String(x).replace(/'/g,"’");
function profiles(){profiles.innerHTML=''}
function renderProfiles(){document.getElementById('profiles').innerHTML=s.groups.map(g=>`<button class="chip ${s.profile===g.id?'primary':''}" onclick="s.profile='${g.id}';save();renderProfiles();renderPublic()">${g.id==='all'?'Voir tout':'Je suis '+g.name}</button>`).join('')}
const labels={Préparation:'Avant le 16 septembre',Mercredi:'16 septembre',Jeudi:'17 septembre',Vendredi:'18 septembre',Samedi:'19 septembre',Dimanche:'20 septembre'};function renderPublic(){const ds=['Préparation','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];days.innerHTML=ds.map(d=>`<button class="chip day ${s.activeDay===d?'active':''}" onclick="s.activeDay='${d}';save();renderPublic()">${d}<br><span class="small" style="color:inherit">${labels[d]}</span></button>`).join('');const list=s.program.filter(p=>p.celebrationId===101&&p.day===s.activeDay&&(s.profile==='all'||p.audience==='all'||p.audience===s.profile));agenda.innerHTML=list.length?list.map(p=>`<div class="slot"><div class="time">${p.time}</div><div><strong>${p.title}</strong><div class="small">${p.date||labels[p.day]} · ${groupName(p.audience)}</div></div></div>`).join(''):'<div class="card">Aucun rendez-vous.</div>';library.innerHTML=s.contents.map(c=>`<div class="card"><strong>${c.name}</strong><div class="small">${c.type} · ${c.category}</div><p class="small">${c.description||''}</p></div>`).join('')}
function nav(k){document.querySelectorAll('[data-admin]').forEach(b=>b.classList.toggle('active',b.dataset.admin===k));renderAdmin(k)}document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>nav(b.dataset.admin));
function chooseCelebration(id){s.selectedCelebrationId=id;save();nav('program')}
function delCelebration(id){if(!confirm('Supprimer cette célébration et son programme ?'))return;s.celebrations=s.celebrations.filter(c=>c.id!==id);s.program=s.program.filter(p=>p.celebrationId!==id);if(s.selectedCelebrationId===id)s.selectedCelebrationId=s.celebrations[0]?.id||null;save();renderAdmin('celebrations')}
function delProgram(id){if(!confirm('Supprimer ce rendez-vous ?'))return;s.program=s.program.filter(p=>p.id!==id);save();renderAdmin('program');renderPublic()}
function delContent(id){if(!confirm('Supprimer ce contenu ?'))return;s.contents=s.contents.filter(c=>c.id!==id);s.program.forEach(p=>p.contentIds=(p.contentIds||[]).filter(x=>x!==id));save();renderAdmin('contents');renderPublic()}
function delCategory(n){if(!confirm(`Supprimer la catégorie « ${n} » ?`))return;s.categories=s.categories.filter(x=>x!==n);save();renderAdmin('categories')}
function delGroup(id){if(id==='all')return alert('Tous est la vue générale.');if(!confirm('Supprimer ce groupe ?'))return;s.contents.forEach(c=>{if(c.audience===id)c.audience='all'});s.program.forEach(p=>{if(p.audience===id)p.audience='all'});s.groups=s.groups.filter(g=>g.id!==id);save();renderProfiles();renderAdmin('groups')}
function renderAdmin(k){const p=panel,c=selected();if(k==='celebrations'){p.innerHTML=`<div class="card"><h3>Choisissez d’abord une célébration</h3><p class="muted">Cliquez sur <strong>Gérer le programme</strong> pour entrer dans la célébration et ajouter ses rendez-vous.</p><div class="list">${s.celebrations.map(x=>`<div class="row ${x.id===s.selectedCelebrationId?'selected':''}"><div><strong>${x.name} ${x.year}</strong><div class="small">${x.startDate||'Date à définir'} → ${x.endDate||'Date à définir'}</div></div><div class="actions"><button class="btn primary" onclick="chooseCelebration(${x.id})">Gérer le programme</button><button class="btn danger" onclick="delCelebration(${x.id})">Supprimer</button></div></div>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Ajouter une célébration</h3><div class="form"><label class="field"><span>Archange</span><select id="aName"><option>Michaël</option><option>Gabriel</option><option>Raphaël</option><option>Ouriel</option></select></label><label class="field"><span>Année</span><input id="aYear"></label><label class="field"><span>Début</span><input id="aStart" type="date"></label><label class="field"><span>Fin</span><input id="aEnd" type="date"></label></div><br><button class="btn primary" id="addCelebration">Ajouter</button></div>`;addCelebration.onclick=()=>{if(!aYear.value.trim())return alert('Indiquez une année');const id=Date.now();s.celebrations.push({id,name:'Archange '+aName.value,year:aYear.value.trim(),archangel:aName.value,startDate:aStart.value,endDate:aEnd.value});s.selectedCelebrationId=id;save();renderAdmin('celebrations')}}
if(k==='program'){if(!c){p.innerHTML='<div class="card">Choisissez une célébration dans « Célébrations ».</div>';return}const items=s.program.filter(x=>x.celebrationId===c.id);p.innerHTML=`<div class="selected-banner"><strong>Vous travaillez sur : ${c.name} ${c.year}</strong><div class="small">Tout ce que vous ajoutez ici appartient uniquement à cette célébration.</div><button class="btn" style="margin-top:8px" onclick="nav('celebrations')">Changer de célébration</button></div><div class="card"><h3>Ajouter un rendez-vous au programme</h3><div class="form"><label class="field"><span>Jour</span><select id="fDay"><option>Préparation</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option><option>Samedi</option><option>Dimanche</option></select></label><label class="field"><span>Date</span><input id="fDate" type="date"></label><label class="field"><span>Horaire</span><input id="fTime" placeholder="18:00"></label><label class="field"><span>Visible pour</span><select id="fAudience">${groupOptions()}</select></label><label class="field full"><span>Titre</span><input id="fTitle" placeholder="Ex. Office du matin"></label><label class="field full"><span>Contenu associé</span><select id="fContent"><option value="">Aucun</option>${s.contents.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label></div><br><button class="btn primary" id="addProgram">Ajouter à ${c.name}</button><div class="list">${items.map(x=>`<div class="row"><div><strong>${x.day} · ${x.time} — ${x.title}</strong><div class="small">${x.date||'Sans date'}</div></div><button class="btn danger" onclick="delProgram(${x.id})">Supprimer</button></div>`).join('')||'<p class="muted">Aucun rendez-vous pour cette célébration.</p>'}</div></div>`;addProgram.onclick=()=>{if(!fTitle.value.trim())return alert('Ajoutez un titre');s.program.push({id:Date.now(),celebrationId:c.id,day:fDay.value,date:fDate.value,time:fTime.value||'—',title:fTitle.value.trim(),audience:fAudience.value,contentIds:fContent.value?[+fContent.value]:[]});save();renderAdmin('program');renderPublic()}}
if(k==='contents'){p.innerHTML=`<div class="card"><h3>Contenus</h3><div class="form"><label class="field full"><span>Nom</span><input id="cName"></label><label class="field"><span>Type</span><select id="cType"><option>PDF</option><option>Audio</option><option>Vidéo</option><option>Texte</option><option>Lien</option></select></label><label class="field"><span>Catégorie</span><select id="cCat">${s.categories.map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field"><span>Visible pour</span><select id="cAud">${groupOptions()}</select></label><label class="field full"><span>Description</span><textarea id="cDesc"></textarea></label></div><br><button class="btn primary" id="addContent">Ajouter</button><div class="list">${s.contents.map(x=>`<div class="row"><strong>${x.name}</strong><button class="btn danger" onclick="delContent(${x.id})">Supprimer</button></div>`).join('')}</div></div>`;addContent.onclick=()=>{if(!cName.value.trim())return;s.contents.push({id:Date.now(),name:cName.value.trim(),type:cType.value,category:cCat.value,audience:cAud.value,description:cDesc.value});save();renderAdmin('contents');renderPublic()}}
if(k==='categories'){p.innerHTML=`<div class="card"><h3>Catégories</h3><div class="actions"><input id="newCat" placeholder="Nouvelle catégorie"><button class="btn primary" id="addCat">Ajouter</button></div><div class="list">${s.categories.map(x=>`<div class="row"><strong>${x}</strong><button class="btn danger" onclick="delCategory('${esc(x)}')">Supprimer</button></div>`).join('')}</div></div>`;addCat.onclick=()=>{const n=newCat.value.trim();if(n&&!s.categories.includes(n)){s.categories.push(n);save();renderAdmin('categories')}}}
if(k==='groups'){p.innerHTML=`<div class="card"><h3>Groupes</h3><p class="small">Les groupes sont configurables.</p><div class="actions"><input id="newGroup" placeholder="Nouveau groupe"><button class="btn primary" id="addGroup">Ajouter</button></div><div class="list">${s.groups.map(g=>`<div class="row"><strong>${g.name}</strong>${g.id==='all'?'<span class="small">Vue générale</span>':`<button class="btn danger" onclick="delGroup('${g.id}')">Supprimer</button>`}</div>`).join('')}</div></div>`;addGroup.onclick=()=>{const n=newGroup.value.trim();if(n){s.groups.push({id:'group-'+Date.now(),name:n});save();renderProfiles();renderAdmin('groups')}}}}
adminButton.onclick=()=>{publicView.classList.add('hidden');adminView.classList.remove('hidden');nav('celebrations');scrollTo(0,0)};back.onclick=()=>{adminView.classList.add('hidden');publicView.classList.remove('hidden');scrollTo(0,0)};goProgram.onclick=()=>programSection.scrollIntoView({behavior:'smooth'});goLibrary.onclick=()=>librarySection.scrollIntoView({behavior:'smooth'});renderProfiles();renderPublic();
</script></body></html>
