<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Célébrations des Archanges</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><div class="top-inner"><div class="brand">Célébrations des Archanges</div><nav class="nav"><button class="nav-btn active" data-tab="program">Programme</button><button class="nav-btn" data-tab="library">Bibliothèque</button><button class="nav-btn" data-tab="info">Informations</button></nav></div></header>
<main class="container"><div id="hero"></div><section id="program" class="section"></section><section id="library" class="section hidden"></section><section id="info" class="section hidden"></section></main>
<footer class="footer">Célébrations des Archanges<br><a class="btn small" href="admin.html" style="margin-top:10px;display:inline-block">Administration</a></footer>
<script src="app-data.js"></script>
<script>
const state=loadState();let activeDay='',filter='Tous',search='';
const current=()=>state.celebrations.find(c=>c.id===state.currentCelebrationId)||state.celebrations[0];
function setAccent(){document.documentElement.style.setProperty('--accent',ARCHANGELS[current()?.archangel]||'#b42318')}
function audienceOk(a){return state.profile==='all'||a==='all'||a===state.profile}
function renderHero(){const c=current();if(!c){hero.innerHTML='<div class="card">Aucune célébration publiée.</div>';return}setAccent();const r=celebrationRange(c);hero.innerHTML=`<div class="hero"><div class="card hero-main"><div class="eyebrow">Célébration en cours</div><h1 class="title">Archange ${esc(c.archangel)}<br>${esc(c.year)}</h1><p class="date-range">${r.start?`${formatDate(r.start)} — ${formatDate(r.end)}`:'Dates à venir'}</p><p class="muted">Retrouvez le programme et les contenus utiles pour cette célébration.</p><div class="chips" id="profiles"></div></div><div class="card"><div class="eyebrow">Votre accès</div><h2>Choisissez votre groupe</h2><p class="muted">Le programme et la bibliothèque s’adaptent automatiquement à votre groupe.</p></div></div>`;const box=document.getElementById('profiles');box.innerHTML=state.groups.map(g=>`<button class="chip ${state.profile===g.id?'active':''}" data-profile="${esc(g.id)}">${g.id==='all'?'Voir tout':esc(g.name)}</button>`).join('');box.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{state.profile=b.dataset.profile;saveState(state);renderHero();renderProgram();renderLibrary()})}
function dayList(){const c=current();return (c?.days||[]).map(d=>({key:d.key,label:d.label,short:d.date?formatDate(d.date,{day:'numeric',month:'short'}):'Sans date',date:d.date||''}))}
function renderProgram(){const c=current(),days=dayList();if(!days.length){program.innerHTML='<div class="notice">Le programme sera ajouté prochainement.</div>';return}if(!days.some(d=>d.key===activeDay))activeDay=days[0].key;const events=state.events.filter(e=>e.celebrationId===c?.id&&e.dayKey===activeDay&&audienceOk(e.audience)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));program.innerHTML=`<div class="section-head"><div><div class="eyebrow">Programme</div><h2>Les rendez-vous</h2></div></div><div class="days">${days.map(d=>`<button class="chip day ${d.key===activeDay?'active':''}" data-day="${esc(d.key)}">${esc(d.label)}<span class="sub">${esc(d.short)}</span></button>`).join('')}</div><div class="agenda">${events.length?events.map(eventHtml).join(''):'<div class="notice">Aucun rendez-vous pour ce jour.</div>'}</div>`;program.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{activeDay=b.dataset.day;renderProgram()});hydrateAudio(program)}
function eventHtml(e){const c=current(),d=dayForEvent(c,e),contents=(e.contentIds||[]).map(id=>state.contents.find(c=>c.id===id)).filter(Boolean).filter(c=>audienceOk(c.audience));return `<article class="event"><div class="time">${esc(e.time||'—')}</div><div><h3 style="margin:0 0 5px">${esc(e.title)}</h3><div class="meta">${esc(d?.label||'Jour')}${d?.date?' · '+formatDate(d.date,{weekday:'long',day:'numeric',month:'long'}):''} · ${esc(groupName(state,e.audience))}</div>${e.description?`<p>${esc(e.description)}</p>`:''}<div class="resources">${contents.map(contentButtons).join('')}</div></div></article>`}
function contentButtons(c){if(c.type==='Audio'&&c.sourceType==='file')return `<span style="width:100%"><strong>${contentIcon(c.type)} ${esc(c.name)}</strong><div data-audio-id="${c.id}"></div><button class="resource-link" onclick="openStoredFile(state.contents.find(x=>x.id===${c.id}),true)">Télécharger</button></span>`;if(c.type==='PDF'&&c.sourceType==='file')return `<button class="resource-link" onclick="openStoredFile(state.contents.find(x=>x.id===${c.id}),false)">📄 ${esc(c.name)}</button><button class="resource-link" onclick="openStoredFile(state.contents.find(x=>x.id===${c.id}),true)">Télécharger</button>`;if(c.type==='Texte'&&c.sourceType==='text')return `<button class="resource-link" onclick="alert(${JSON.stringify(c.text||'')})">¶ ${esc(c.name)}</button>`;if(c.url)return `<a class="resource-link" href="${esc(c.url)}" target="_blank" rel="noopener">${contentIcon(c.type)} ${esc(c.name)}</a>`;if(c.sourceType==='file')return `<button class="resource-link" onclick="openStoredFile(state.contents.find(x=>x.id===${c.id}),false)">${contentIcon(c.type)} ${esc(c.name)}</button>`;return `<span class="resource-link">${contentIcon(c.type)} ${esc(c.name)}</span>`}
async function hydrateAudio(root){for(const el of root.querySelectorAll('[data-audio-id]')){const c=state.contents.find(x=>x.id===+el.dataset.audioId);if(c)await attachAudioPlayer(el,c)}}
function renderLibrary(){const cats=['Tous',...state.categories];const list=state.contents.filter(c=>audienceOk(c.audience)).filter(c=>filter==='Tous'||c.category===filter).filter(c=>!search||`${c.name} ${c.description||''}`.toLowerCase().includes(search.toLowerCase()));library.innerHTML=`<div class="section-head"><div><div class="eyebrow">Bibliothèque</div><h2>Tous les contenus</h2></div></div><div class="filters">${cats.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="searchbar"><input id="searchBox" placeholder="Rechercher un contenu" value="${esc(search)}"></div><div class="grid3">${list.length?list.map(c=>`<article class="resource-card"><div class="resource-type">${esc(c.type)} · ${esc(c.category||'Sans catégorie')}</div><h3>${esc(c.name)}</h3><p class="muted">${esc(c.description||'')}</p><div class="resources">${contentButtons(c)}</div></article>`).join(''):'<div class="notice">Aucun contenu disponible.</div>'}</div>`;library.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderLibrary()});document.getElementById('searchBox').oninput=e=>{search=e.target.value;renderLibrary()};hydrateAudio(library)}
function renderInfo(){const c=current(),r=celebrationRange(c);info.innerHTML=`<div class="card"><div class="eyebrow">Informations</div><h2>Archange ${esc(c?.archangel||'')}</h2><p class="muted">${r.start?`Célébration du ${formatDate(r.start)} au ${formatDate(r.end)}.`:'Les dates seront publiées prochainement.'}</p></div>`}
function showTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));program.classList.toggle('hidden',tab!=='program');library.classList.toggle('hidden',tab!=='library');info.classList.toggle('hidden',tab!=='info');if(tab==='library')renderLibrary();if(tab==='info')renderInfo()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));setAccent();renderHero();renderProgram();renderLibrary();renderInfo();
</script></body></html>
